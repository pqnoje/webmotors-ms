# ============================
# Configuração do Banco de Dados
# ============================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:anuncios}
spring.datasource.username=${DB_USER:webmotors}
spring.datasource.password=${DB_PASSWORD:webmotors_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================
# Configuração do JPA/Hibernate
# ============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# ============================
# Configuração do Serviço
# ============================

server.port=8082
spring.application.name=anuncios-service
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# ============================
# Configuração do Kafka
# ============================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=anuncios-usuarios-projection
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ============================
# Configuração do Flyway
# ============================

spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public
spring.flyway.default-schema=public\n