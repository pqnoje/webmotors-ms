spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:pagamentos}
spring.datasource.username=${DB_USER:webmotors}
spring.datasource.password=${DB_PASSWORD:webmotors_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public
spring.application.name=pagamentos-service
server.port=8083
management.endpoints.web.exposure.include=health,info,metrics,prometheus
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public
spring.flyway.default-schema=public

# Agendamento (gerador de transacoes + reconciliador de pendentes)
spring.task.scheduling.pool.size=2
fastpay.generator.max-tps=10000
fastpay.generator.worker-count=8
fastpay.generator.queue-capacity=500

# Resiliencia da liquidacao no webmotors-fastpay
resilience4j.circuitbreaker.instances.fastpay.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.fastpay.sliding-window-size=20
resilience4j.circuitbreaker.instances.fastpay.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.fastpay.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fastpay.slow-call-duration-threshold=250ms
resilience4j.circuitbreaker.instances.fastpay.slow-call-rate-threshold=60
resilience4j.circuitbreaker.instances.fastpay.wait-duration-in-open-state=3s
resilience4j.circuitbreaker.instances.fastpay.permitted-number-of-calls-in-half-open-state=5
resilience4j.circuitbreaker.instances.fastpay.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.retry.instances.fastpay.max-attempts=3
resilience4j.retry.instances.fastpay.wait-duration=100ms
resilience4j.retry.instances.fastpay.enable-exponential-backoff=true
resilience4j.retry.instances.fastpay.exponential-backoff-multiplier=2
resilience4j.retry.instances.fastpay.retry-exceptions=com.webmotors.pagamentos.adapter.out.gateway.FastPayIndisponivelException

resilience4j.bulkhead.instances.fastpay.max-concurrent-calls=8
resilience4j.bulkhead.instances.fastpay.max-wait-duration=0ms

fastpay.reconciler.interval-ms=2000
fastpay.reconciler.worker-count=4
fastpay.reconciler.batch-size=50