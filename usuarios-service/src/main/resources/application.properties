# ============================
# Configuração do Banco de Dados
# ============================

# URL de conexão com o PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:usuarios}

# Usuário de aplicação (tem acesso às tabelas do schema public)
spring.datasource.username=${DB_USER:webmotors}
spring.datasource.password=${DB_PASSWORD:webmotors_dev_password}

# Driver JDBC para PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================
# Configuração do JPA/Hibernate
# ============================

# ddl-auto=update → cria/atualiza tabelas conforme entidades
spring.jpa.hibernate.ddl-auto=update

# show-sql=false → evita expor SQL em logs por padrão
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Dialeto específico do PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Usando schema public (onde já está a tabela usuarios)
spring.jpa.properties.hibernate.default_schema=public

# ============================
# Configuração do Serviço
# ============================

# Porta onde o microserviço vai rodar
server.port=8081

# Nome da aplicação
spring.application.name=usuarios-service
anuncios-service.url=${ANUNCIOS_SERVICE_URL:http://localhost:8082}
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# ============================
# Configuração do Kafka
# ============================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ============================
# Configuração do Flyway (migrações)
# ============================

# baseline-on-migrate=true → cria baseline se não houver histórico
spring.flyway.baseline-on-migrate=true

# Usando schema public para migrações
spring.flyway.schemas=public
spring.flyway.default-schema=public\n